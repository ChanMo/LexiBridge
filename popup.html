<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="icon_48.png" alt="" width="24" height="24" />
    <span class="name">LexiBridge</span>
  </header>

  <section class="site" id="site">
    <div class="site-text">
      <div class="domain" id="domain"></div>
      <div class="status" id="status"></div>
    </div>
    <label class="switch" data-i18n-attr="title:popup_siteToggle">
      <input type="checkbox" role="switch" id="site-toggle" data-i18n-attr="aria-label:popup_siteToggle" />
      <span class="track"><span class="thumb"></span></span>
    </label>
  </section>

  <section class="styles">
    <div class="label" data-i18n="popup_highlightStyle">高亮样式</div>
    <div class="segmented" role="radiogroup" data-i18n-attr="aria-label:popup_highlightStyle">
      <label><input type="radio" name="style" value="underline" /><span><b class="sample underline">word</b><span data-i18n="popup_styleUnderline">下划线</span></span></label>
      <label><input type="radio" name="style" value="tint" /><span><b class="sample tint">word</b><span data-i18n="popup_styleTint">底色</span></span></label>
      <label><input type="radio" name="style" value="dotted" /><span><b class="sample dotted">word</b><span data-i18n="popup_styleDotted">点线</span></span></label>
    </div>
  </section>

  <footer class="links">
    <button type="button" id="words-link"><span data-i18n="common_wordList">单词库</span><span class="count" id="word-count"></span></button>
    <button type="button" id="level-link">
      <span data-i18n="common_level">英语水平</span><span class="count" id="level-name"></span>
      <span class="progress" id="progress" hidden><span id="progress-band"></span><span class="track"><i></i></span><span id="progress-count"></span></span>
    </button>
  </footer>

  <aside class="review" id="review" hidden>
    <p data-i18n="reviewPrompt_body">如果 LexiBridge 对你有帮助，留下一条评价会很有帮助。</p>
    <div class="review-actions">
      <button type="button" class="primary" data-choice="rate" data-i18n="reviewPrompt_rate">去评价</button>
      <button type="button" data-choice="later" data-i18n="reviewPrompt_later">以后再说</button>
      <button type="button" data-choice="never" data-i18n="reviewPrompt_never">不用了</button>
    </div>
    <button type="button" class="review-close" data-choice="closed" data-i18n-attr="title:common_close;aria-label:common_close"></button>
  </aside>
  <script src="lexicon.js"></script>
  <script src="packs.js"></script>
  <script src="i18n.js"></script>
  <script src="review.js"></script>
  <script src="popup.js"></script>
</body>
</html>
