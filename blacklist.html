<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禁用网站 | LexiBridge</title>
    <link rel="icon" href="icon_32.png" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body data-page="blocked">
    <aside class="side"></aside>
    <main>
      <header class="page-head">
        <div>
          <h1>禁用网站</h1>
          <p class="sub">这些网站上不会标出生词。也可以在网站上点击扩展图标，直接关闭开关。</p>
        </div>
      </header>
      <section class="panel">
        <form class="add-site" id="add-form">
          <input class="input" id="domain" placeholder="example.com 或粘贴网址" aria-label="网站域名" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn primary"><svg class="icon"><use href="icons/ui.svg#add"/></svg>添加</button>
        </form>
        <p class="hint" id="add-error" role="alert" style="color:var(--danger);padding:0 12px" hidden></p>
        <div id="list"></div>
      </section>
    </main>
    <script src="lexicon.js"></script>
    <script src="page.js"></script>
    <script src="blacklist.js"></script>
  </body>
</html>
