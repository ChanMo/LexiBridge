    <a href="{{ t.base | append: '/install.html' | relative_url }}">{{ t.install }}</a>
    <a href="{{ t.base | append: '/privacy.html' | relative_url }}">{{ t.privacy_policy }}</a>

    <span>© {{ site.time | date: '%Y' }} <a href="https://chanmo.github.io/" rel="author">ChanMo</a> · {{ t.license }}</span>

</footer>
