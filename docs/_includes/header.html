<div class="wrap">
  <header class="site-head">
    <a class="logo" href="{{ t.base | append: '/' | relative_url }}"><img src="{{ '/assets/icon.png' | relative_url }}" alt="">LexiBridge</a>
    <nav aria-label="{{ t.nav }}">
      <a href="{{ t.base | append: '/#how' | relative_url }}">{{ t.how }}</a>
      <a href="{{ t.base | append: '/install.html' | relative_url }}">{{ t.install }}</a>
      <a href="{{ t.base | append: '/privacy.html' | relative_url }}">{{ t.privacy }}</a>
      <a href="{{ site.github_url }}">GitHub</a>
      {%- for l in site.data.ui %}{% unless l[0] == lang %}
      <a href="{{ l[1].base | append: path | relative_url }}" hreflang="{{ l[0] }}" lang="{{ l[0] }}">{{ l[1].label }}</a>
      {%- endunless %}{% endfor %}
    </nav>
    <a class="btn primary small" href="{{ site.store_url }}">{{ t.add_chrome }}</a>
  </header>
</div>
