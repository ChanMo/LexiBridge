<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语水平 | LexiBridge</title>
    <link rel="icon" href="icon_32.png" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body data-page="level">
    <aside class="side"></aside>
    <main>
      <div class="col narrow">
        <div class="head"><h1>英语水平</h1></div>
        <p class="meta">LexiBridge 只标出比你的水平更难的词。</p>
        <p class="lead" id="welcome" hidden>欢迎！已按 <b class="marked">大学四级</b> 准备好词库，可以换成更合适的水平。</p>
        <div class="group" id="levels" role="radiogroup" aria-label="英语水平"></div>
        <p class="note">切换水平会替换整个词库；之后可以在网页上随时移出认识的词、加入新词。</p>
      </div>
    </main>

    <template id="level-row">
      <button type="button" class="opt" role="radio">
        <span class="radio"></span>
        <span class="text"><span class="name"></span><br><span class="desc"></span></span>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="count"></span>
      </button>
    </template>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <div class="dialog-head"><h2 id="confirm-title">替换当前词库？</h2></div>
        <div class="dialog-body"><p id="confirm-text"></p></div>
        <div class="dialog-foot">
          <button type="submit" value="cancel" class="btn secondary">取消</button>
          <button type="submit" value="ok" class="btn primary">替换</button>
        </div>
      </form>
    </dialog>

    <script src="lexicon.js"></script>
    <script src="levels.js"></script>
    <script src="page.js"></script>
    <script src="level.js"></script>
  </body>
</html>
