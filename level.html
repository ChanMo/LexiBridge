<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择水平 | LexiBridge</title>
    <link rel="icon" href="icon_32.png" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body data-page="level">
    <aside class="side"></aside>
    <main>
      <header class="page-head">
        <div>
          <h1>选择你的英语水平</h1>
          <p class="sub">LexiBridge 会从内置词表中去掉你已掌握的词，只把要学的词放进词库。</p>
        </div>
      </header>
      <div class="callout" id="welcome" hidden>
        <b>欢迎使用 LexiBridge！</b>已按「大学四级」为你准备好词库。选一个更符合你的水平，之后浏览英文网页时，你还不认识的词会被标出来。
      </div>
      <div id="levels" class="levels"></div>
      <p class="note">之后在网页上可以随时把认识的词移出词库、把新词加进来。切换水平会替换整个词库。</p>
    </main>

    <template id="level-card">
      <button type="button" class="level-card">
        <span class="badge">当前</span>
        <span class="name"></span>
        <span class="known"></span>
        <span class="learn"></span>
        <span class="count"></span>
      </button>
    </template>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <div class="dialog-head"><h2 id="confirm-title">替换当前词库？</h2></div>
        <div class="dialog-body"><p id="confirm-text"></p></div>
        <div class="dialog-foot">
          <button type="submit" value="cancel" class="btn">取消</button>
          <button type="submit" value="ok" class="btn primary">替换</button>
        </div>
      </form>
    </dialog>

    <script src="lexicon.js"></script>
    <script src="levels.js"></script>
    <script src="page.js"></script>
    <script src="level.js"></script>
  </body>
</html>
