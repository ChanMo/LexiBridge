<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词库 | LexiBridge</title>
    <link rel="icon" href="icon_32.png" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body data-page="words">
    <aside class="side"></aside>
    <main>
      <header class="page-head">
        <div>
          <h1>单词库</h1>
          <p class="sub"><span id="total">0</span> 个单词<span id="level-info" hidden> · 水平 <a href="level.html" id="level-name"></a></span></p>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="import-open"><svg class="icon"><use href="icons/ui.svg#upload"/></svg>导入</button>
          <button type="button" class="btn" id="export-btn"><svg class="icon"><use href="icons/ui.svg#download"/></svg>导出</button>
          <button type="button" class="btn primary" id="add-open"><svg class="icon"><use href="icons/ui.svg#add"/></svg>添加单词</button>
        </div>
      </header>

      <section class="panel">
        <div class="toolbar">
          <label class="search">
            <svg class="icon"><use href="icons/ui.svg#search"/></svg>
            <input class="input" type="search" id="search" placeholder="搜索单词或释义" aria-label="搜索单词或释义" autocomplete="off" />
          </label>
          <span class="count" id="result-count"></span>
          <button type="button" class="btn ghost danger" id="clear-open"><svg class="icon"><use href="icons/ui.svg#delete"/></svg>清空词库</button>
        </div>
        <div id="list"></div>
        <nav class="pager" id="pager" aria-label="分页">
          <span id="page-info"></span>
          <button type="button" class="icon-btn" id="prev" aria-label="上一页" title="上一页"><svg class="icon"><use href="icons/ui.svg#prev"/></svg></button>
          <button type="button" class="icon-btn" id="next" aria-label="下一页" title="下一页"><svg class="icon"><use href="icons/ui.svg#next"/></svg></button>
        </nav>
      </section>
    </main>

    <template id="row">
      <div class="row">
        <div><span class="word"></span><span class="phonetic"></span></div>
        <div class="def-slot"></div>
        <div class="row-actions">
          <button type="button" class="icon-btn edit" title="编辑" aria-label="编辑"><svg class="icon"><use href="icons/ui.svg#edit"/></svg></button>
          <button type="button" class="icon-btn danger remove" title="删除" aria-label="删除"><svg class="icon"><use href="icons/ui.svg#delete"/></svg></button>
        </div>
      </div>
    </template>

    <dialog id="word-dialog" aria-labelledby="word-dialog-title">
      <form method="dialog" id="word-form">
        <div class="dialog-head">
          <h2 id="word-dialog-title">添加单词</h2>
          <button type="submit" value="cancel" class="icon-btn" aria-label="关闭" formnovalidate><svg class="icon"><use href="icons/ui.svg#close"/></svg></button>
        </div>
        <div class="dialog-body">
          <label class="field"><span>单词</span>
            <input class="input" name="word" required autocomplete="off" spellcheck="false" />
          </label>
          <label class="field"><span>释义</span>
            <textarea class="input" name="definition" required placeholder="如：[əˈbrʌpt] adj. 突然的；陡峭的"></textarea>
            <p class="hint" id="definition-hint">输入单词后，会自动从内置词库填入释义</p>
          </label>
        </div>
        <div class="dialog-foot">
          <span class="grow" id="save-shortcut"></span>
          <button type="submit" value="cancel" class="btn" formnovalidate>取消</button>
          <button type="submit" value="save" class="btn primary">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="import-dialog" aria-labelledby="import-dialog-title">
      <form method="dialog" id="import-form">
        <div class="dialog-head">
          <h2 id="import-dialog-title">导入单词</h2>
          <button type="submit" value="cancel" class="icon-btn" aria-label="关闭"><svg class="icon"><use href="icons/ui.svg#close"/></svg></button>
        </div>
        <div class="dialog-body">
          <label class="drop" id="drop">
            <svg class="icon"><use href="icons/ui.svg#upload"/></svg>
            <b id="file-name">选择 JSON 文件，或拖到这里</b>
            <span>格式：[["word", "释义"], ...]</span>
            <input type="file" accept=".json,application/json" id="file" />
          </label>
          <label class="check"><input type="checkbox" id="replace" />替换现有词库（默认合并，同名单词以导入的释义为准）</label>
          <p class="hint" style="margin-top:14px">示例词表：</p>
          <ul class="samples">
            <li><a download href="https://raw.githubusercontent.com/ChanMo/LexiBridge/main/words/CET4_edited.json">大学四级 4615</a></li>
            <li><a download href="https://raw.githubusercontent.com/ChanMo/LexiBridge/main/words/CET6_edited.json">大学六级 2270</a></li>
            <li><a download href="https://raw.githubusercontent.com/ChanMo/LexiBridge/main/words/GRE_8000_Words.json">GRE 7744</a></li>
            <li><a download href="https://raw.githubusercontent.com/ChanMo/LexiBridge/main/words/GRE_abridged.json">GRE 精简 4333</a></li>
            <li><a download href="https://raw.githubusercontent.com/ChanMo/LexiBridge/main/words/OALD8_abridged_edited.json">牛津高阶第八版 13653</a></li>
          </ul>
          <p class="hint" id="import-error" role="alert" style="color:var(--danger)"></p>
        </div>
        <div class="dialog-foot">
          <button type="submit" value="cancel" class="btn">取消</button>
          <button type="submit" value="import" class="btn primary" id="import-btn" disabled>导入</button>
        </div>
      </form>
    </dialog>

    <dialog id="clear-dialog" aria-labelledby="clear-dialog-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="clear-dialog-title">清空词库？</h2>
        </div>
        <div class="dialog-body">
          <p>将删除全部 <b id="clear-count">0</b> 个单词，网页上不会再有高亮。清空后可以立即撤销；如需长期保留，建议先导出备份。</p>
        </div>
        <div class="dialog-foot">
          <button type="submit" value="export" class="btn ghost">先导出</button>
          <span class="grow"></span>
          <button type="submit" value="cancel" class="btn">取消</button>
          <button type="submit" value="clear" class="btn solid-danger" id="clear-btn">清空</button>
        </div>
      </form>
    </dialog>

    <script src="lexicon.js"></script>
    <script src="levels.js"></script>
    <script src="page.js"></script>
    <script src="options.js"></script>
  </body>
</html>
