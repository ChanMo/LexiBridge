<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="words_title">单词库 | LexiBridge</title>
    <link rel="icon" href="icon_32.png" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body data-page="words">
    <aside class="side"></aside>
    <main>
      <div class="col">
        <div class="head">
          <h1 data-i18n="common_wordList">单词库</h1>
          <button type="button" class="btn primary" id="add-open"><svg class="icon"><use href="icons/ui.svg#add"/></svg><span data-i18n="words_add">添加单词</span></button>
          <button type="button" class="icon-btn" id="more-open" data-i18n-attr="title:words_more;aria-label:words_more"><svg class="icon"><use href="icons/ui.svg#more"/></svg></button>
        </div>
        <p class="meta"><span id="total"></span><span id="level-info" hidden></span><span id="result-count"></span></p>

        <label class="search">
          <svg class="icon"><use href="icons/ui.svg#search"/></svg>
          <input class="input" type="search" id="search" data-i18n-attr="placeholder:words_search;aria-label:words_search" autocomplete="off" />
          <span class="kbd" aria-hidden="true">/</span>
        </label>
        <ul class="list" id="list"></ul>
        <nav class="pager" id="pager" data-i18n-attr="aria-label:words_pager">
          <span id="page-info"></span>
          <button type="button" class="icon-btn" id="prev" data-i18n-attr="aria-label:words_prev;title:words_prev"><svg class="icon"><use href="icons/ui.svg#prev"/></svg></button>
          <button type="button" class="icon-btn" id="next" data-i18n-attr="aria-label:words_next;title:words_next"><svg class="icon"><use href="icons/ui.svg#next"/></svg></button>
        </nav>
      </div>
    </main>

    <div class="menu" id="more-menu" popover role="menu">
      <button type="button" role="menuitem" id="import-open"><svg class="icon"><use href="icons/ui.svg#upload"/></svg><span data-i18n="words_import">导入…</span></button>
      <button type="button" role="menuitem" id="export-btn"><svg class="icon"><use href="icons/ui.svg#download"/></svg><span data-i18n="words_export">导出</span></button>
      <hr>
      <button type="button" role="menuitem" class="danger" id="clear-open"><svg class="icon"><use href="icons/ui.svg#delete"/></svg><span data-i18n="words_clear">清空词库…</span></button>
    </div>

    <template id="row">
      <li class="item">
        <div class="body">
          <div><span class="word"></span><span class="phonetic"></span></div>
          <div class="def-slot"></div>
        </div>
        <div class="row-actions">
          <button type="button" class="icon-btn edit" data-i18n-attr="title:words_edit;aria-label:words_edit"><svg class="icon"><use href="icons/ui.svg#edit"/></svg></button>
          <button type="button" class="icon-btn remove" data-i18n-attr="title:words_delete;aria-label:words_delete"><svg class="icon"><use href="icons/ui.svg#delete"/></svg></button>
        </div>
      </li>
    </template>

    <dialog id="word-dialog" aria-labelledby="word-dialog-title">
      <form method="dialog" id="word-form">
        <div class="dialog-head">
          <h2 id="word-dialog-title" data-i18n="words_add">添加单词</h2>
          <button type="submit" value="cancel" class="icon-btn" data-i18n-attr="aria-label:common_close" formnovalidate><svg class="icon"><use href="icons/ui.svg#close"/></svg></button>
        </div>
        <div class="dialog-body">
          <label class="field"><span data-i18n="words_word">单词</span>
            <input class="input" name="word" required autocomplete="off" spellcheck="false" />
          </label>
          <label class="field"><span data-i18n="common_definition">释义</span>
            <textarea class="input" name="definition" required data-i18n-attr="placeholder:words_definitionPlaceholder"></textarea>
            <p class="hint" id="definition-hint" data-i18n="words_definitionHint">输入单词后，会自动从内置词库填入释义</p>
          </label>
        </div>
        <div class="dialog-foot">
          <span class="grow" id="save-shortcut"></span>
          <button type="submit" value="cancel" class="btn secondary" formnovalidate data-i18n="common_cancel">取消</button>
          <button type="submit" value="save" class="btn primary" data-i18n="common_save">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="import-dialog" aria-labelledby="import-dialog-title">
      <form method="dialog" id="import-form">
        <div class="dialog-head">
          <h2 id="import-dialog-title" data-i18n="words_importTitle">导入单词</h2>
          <button type="submit" value="cancel" class="icon-btn" data-i18n-attr="aria-label:common_close"><svg class="icon"><use href="icons/ui.svg#close"/></svg></button>
        </div>
        <div class="dialog-body">
          <label class="drop" id="drop">
            <svg class="icon"><use href="icons/ui.svg#upload"/></svg>
            <b id="file-name" data-i18n="words_importDrop">选择 JSON 文件，或拖到这里</b>
            <span data-i18n="words_importFormat">LexiBridge 导出的文件，或 [["word", "释义"], ...] 格式的 JSON</span>
            <input type="file" accept=".json,application/json" id="file" />
          </label>
          <label class="check"><input type="checkbox" id="replace" /><span data-i18n="words_importReplace">替换现有词库（默认合并，同名单词以导入的为准）</span></label>
          <p class="error" id="import-error" role="alert"></p>
        </div>
        <div class="dialog-foot">
          <button type="submit" value="cancel" class="btn secondary" data-i18n="common_cancel">取消</button>
          <button type="submit" value="import" class="btn primary" id="import-btn" disabled data-i18n="words_importButton">导入</button>
        </div>
      </form>
    </dialog>

    <dialog id="clear-dialog" aria-labelledby="clear-dialog-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="clear-dialog-title" data-i18n="words_clearTitle">清空词库？</h2>
        </div>
        <div class="dialog-body">
          <p id="clear-text"></p>
        </div>
        <div class="dialog-foot">
          <button type="submit" value="export" class="btn" data-i18n="words_exportFirst">先导出</button>
          <span class="grow"></span>
          <button type="submit" value="cancel" class="btn secondary" data-i18n="common_cancel">取消</button>
          <button type="submit" value="clear" class="btn danger" id="clear-btn" data-i18n="words_clearButton">清空</button>
        </div>
      </form>
    </dialog>

    <script src="lexicon.js"></script>
    <script src="packs.js"></script>
    <script src="i18n.js"></script>
    <script src="page.js"></script>
    <script src="options.js"></script>
  </body>
</html>
